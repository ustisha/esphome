esphome:
  name: veranda
  friendly_name:  "Веранда"
  area: "Веранда"

esp8266:
  board: d1_mini
  restore_from_flash: true

# Enable logging
logger:
    level: INFO

# Enable Home Assistant API
api:
    encryption:
        key: !secret veranda_api_encryption_key

ota:
    - platform: esphome
      password: !secret veranda_ota_password

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    reboot_timeout: "5min"

one_wire:
    - platform: gpio
      pin: GPIO5

sensor:
    - platform: dallas_temp
      name: temperature
      update_interval: 60s

packages:
    veranda_no_display: !include
        file: common/no-display.yaml
        vars:
            light_name: veranda
    veranda_no_button: !include
        file: common/no-button.yaml
        vars:
            light_name: veranda
    veranda: !include
        file: common/auto-light.yaml
        vars:
            light_name: veranda
            name_prefix: "Veranda"
            motion_gpio: GPIO12
            motion_pullup: true
            relay_gpio: GPIO15
            relay_inverted: false
            timeout_max_value: 300

    porch_no_display: !include
        file: common/no-display.yaml
        vars:
            light_name: porch
    porch_no_button: !include
        file: common/no-button.yaml
        vars:
            light_name: porch
    porch: !include
        file: common/auto-light.yaml
        vars:
            light_name: porch
            name_prefix: "Porch"
            motion_gpio: GPIO14
            motion_pullup: true
            relay_gpio: GPIO16
            relay_inverted: false
            timeout_max_value: 300

binary_sensor:
    -   platform: gpio
        pin:
            number: GPIO13
            mode:
                input: true
                pullup: true
        device_class: door
        name: "Veranda door"
        id: door_1
        filters:
            -   delayed_on: 50ms
            -   delayed_off: 50ms

