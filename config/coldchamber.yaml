esphome:
    name: coldchamber
    friendly_name: "Холодильный отсек"
    area: "Подвал"

esp8266:
    board: d1_mini
    restore_from_flash: true

# Enable logging
logger:
    level: INFO

# Enable Home Assistant API
api:
    encryption:
        key: !secret coldchamber_api_encryption_key

ota:
    -   platform: esphome
        password: !secret coldchamber_ota_password

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    reboot_timeout: "5min"

i2c:

sensor:
    -   platform: bme280_i2c
        temperature:
            name: "BME280 Temperature"
            id: bme280_temperature
        pressure:
            name: "BME280 Pressure"
            id: bme280_pressure
        humidity:
            name: "BME280 Relative Humidity"
            id: bme280_humidity
        address: 0x76
        update_interval: 30s

packages:
    coldchamber_no_display: !include
        file: common/no-display.yaml
        vars:
            light_name: coldchamber
    coldchamber: !include
        file: common/auto-light.yaml
        vars:
            light_name: coldchamber
            name_prefix: "Chamber"
            motion_gpio: GPIO12
            motion_pullup: true
            relay_gpio: GPIO0
            relay_inverted: false
            timeout_max_value: 300
    basement_no_display: !include
        file: common/no-display.yaml
        vars:
            light_name: basement
    basement: !include
        file: common/auto-light.yaml
        vars:
            light_name: basement
            name_prefix: "Basement"
            motion_gpio: GPIO14
            motion_pullup: true
            relay_gpio: GPIO2
            relay_inverted: false
            timeout_max_value: 300

binary_sensor:
    -   platform: gpio
        pin:
            number: GPIO13
            mode:
                input: true
                pullup: true
        device_class: door
        name: "Chamber door"
        id: door_1
        filters:
            -   delayed_on: 50ms
            -   delayed_off: 50ms

switch:
    -   platform: gpio
        pin: GPIO15
        name: "Fan"
        id: fan
        inverted: False
        restore_mode: ALWAYS_OFF
    -   platform: gpio
        pin: GPIO16
        name: "Freezer socket"
        id: freezer_socket
        inverted: False
        restore_mode: ALWAYS_OFF
