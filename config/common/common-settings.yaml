substitutions:
    fast_connect: "Off"
    output_power: "8.5dB"
    logger_level: "INFO"

wifi:
    networks:
        -   ssid: !secret wifi_ssid
            password: !secret wifi_password
        -   ssid: !secret wifi_ssid_5
            password: !secret wifi_password
    power_save_mode: none
    enable_on_boot: true
    fast_connect: ${fast_connect}
    output_power: ${output_power}
    reboot_timeout: "5min"

switch:
    -   platform: restart
        name: "Restart"

sensor:
    -   platform: wifi_signal
        name: "WiFi Signal dB"
        id: wifi_signal_db
        update_interval: 60s
        entity_category: "diagnostic"

text_sensor:
    -   platform: wifi_info
        ssid:
            name: "WiFi SSID"
            entity_category: "diagnostic"

# Enable logging
logger:
    level: ${logger_level}

