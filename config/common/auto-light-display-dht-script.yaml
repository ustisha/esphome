script:
    -   id: lvgl_${light_name}_dht_update
        then:
            -   lvgl.label.update:
                    id: lv_${light_name}_temp
                    text:
                        format: "%.1f°C"
                        args: [ 'id(${temp_id}).state' ]
                        if_nan: "--.-°C"
            -   lvgl.label.update:
                    id: lv_${light_name}_humidity
                    text:
                        format: "%d%%"
                        args: [ 'int(id(${humidity_id}).state)' ]
