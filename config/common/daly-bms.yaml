daly_bms:
    id: daly_bms_hub
    update_interval: ${update_interval}

globals:
    # Оставшийся заряд в А·ч. -1 = счётчик ещё не инициализирован.
    # Переживает перезагрузку ESP; запись во флеш батчится (preferences, 60s).
    -   id: soc_ah
        type: float
        restore_value: true
        initial_value: '-1'
    # millis() предыдущей выборки тока; намеренно не восстанавливается,
    # чтобы после перезагрузки не проинтегрировать «дыру».
    -   id: soc_last_ms
        type: uint32_t
        restore_value: false
        initial_value: '0'

script:
    -   id: soc_update
        mode: single
        then:
            -   lambda: |-
                    const float cap = ${battery_capacity_ah};
                    const float v_full = ${battery_full_voltage};
                    const float i_tail = ${battery_tail_current};

                    float v = id(battery_voltage).state;
                    float i = id(battery_current).state;
                    if (isnan(v) || isnan(i)) return;

                    // Первый старт после прошивки: засеваем счётчик по таблице
                    // напряжения LiFePO4 4S. Дальше таблица не участвует.
                    if (id(soc_ah) < 0.0f) {
                        float voltages[] = {11.8, 12.2, 12.4, 12.6, 12.7, 12.8, 12.9, 13.0, 13.2, 13.3, 14.5};
                        float percents[] = {0,    10,   20,   30,   40,   50,   60,   96,   97,   98,   100};
                        const int n = 11;
                        float pct = 100.0f;
                        if (v <= voltages[0]) {
                            pct = 0.0f;
                        } else if (v < voltages[n - 1]) {
                            for (int k = 0; k < n - 1; k++) {
                                if (v <= voltages[k + 1]) {
                                    pct = percents[k] + (v - voltages[k]) / (voltages[k + 1] - voltages[k]) * (percents[k + 1] - percents[k]);
                                    break;
                                }
                            }
                        }
                        id(soc_ah) = cap * pct / 100.0f;
                        ESP_LOGI("soc", "Seed from voltage: %.2f V -> %.1f%%", v, pct);
                    }

                    // Кулоновский счёт. Ток положительный = заряд.
                    uint32_t now = millis();
                    if (id(soc_last_ms) != 0) {
                        float dt_h = (float) (now - id(soc_last_ms)) / 3600000.0f;
                        // Пропуск больше получаса = BMS молчал, интегрировать нечего
                        if (dt_h > 0.0f && dt_h < 0.5f) {
                            id(soc_ah) += i * dt_h;
                        }
                    }
                    id(soc_last_ms) = now;

                    // Анкер: батарея реально полна, когда держится напряжение
                    // выше порога И зарядный ток упал до хвостового.
                    // Это и лечит дрейф — раз в цикл заряда счётчик привязывается к 100%.
                    if (v >= v_full && i >= 0.0f && i < i_tail) {
                        if (id(soc_ah) < cap) {
                            ESP_LOGI("soc", "Full: %.2f V, %.2f A -> anchor %.1f -> %.1f Ah", v, i, id(soc_ah), cap);
                        }
                        id(soc_ah) = cap;
                    }

                    if (id(soc_ah) > cap) id(soc_ah) = cap;
                    if (id(soc_ah) < 0.0f) id(soc_ah) = 0.0f;

sensor:
    -   platform: daly_bms
        voltage:
            name: "Battery Voltage"
            id: battery_voltage
            icon: "mdi:flash-triangle"
        current:
            name: "Battery Current"
            id: battery_current
            icon: "mdi:current-dc"
            # Кулоновский счёт двигаем по факту прихода выборки тока,
            # а не по таймеру — так dt совпадает с реальным интервалом опроса.
            on_value:
                -   script.execute: soc_update
#        battery_level:
#            name: "Battery Level"
#            icon: "mdi:battery"
        max_cell_voltage:
            name: "Max Cell Voltage"
            icon: "mdi:arrow-up-bold"
        max_cell_voltage_number:
            name: "Max Cell Voltage Number"
            icon: "mdi:numeric"
        min_cell_voltage:
            name: "Min Cell Voltage"
            icon: "mdi:arrow-down-bold"
        min_cell_voltage_number:
            name: "Min Cell Voltage Number"
            icon: "mdi:numeric"
        max_temperature:
            name: "Max Temperature"
            icon: "mdi:thermometer-high"
        max_temperature_probe_number:
            name: "Max Temperature Probe Number"
            icon: "mdi:numeric"
        min_temperature:
            name: "Min Temperature"
            icon: "mdi:thermometer-low"
        min_temperature_probe_number:
            name: "Min Temperature Probe Number"
            icon: "mdi:numeric"
        remaining_capacity:
            name: "Remaining Capacity"
            icon: "mdi:battery-clock"
        cells_number:
            name: "Cells Number"
            id: cells_number
            icon: "mdi:counter"
        temperature_1:
            name: "Temperature 1"
            icon: "mdi:thermometer"
        cell_1_voltage:
            name: "Cell 1 Voltage"
            icon: "mdi:battery-heart-variant"
        cell_2_voltage:
            name: "Cell 2 Voltage"
            icon: "mdi:battery-heart-variant"
        cell_3_voltage:
            name: "Cell 3 Voltage"
            icon: "mdi:battery-heart-variant"
        cell_4_voltage:
            name: "Cell 4 Voltage"
            icon: "mdi:battery-heart-variant"

    -   platform: template
        name: "Battery Power"
        id: battery_power
        icon: "mdi:lightning-bolt"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        lambda: |-
            return id(battery_voltage).state * id(battery_current).state;

    -   platform: template
        name: "Battery Charge Power"
        id: battery_charge_power
        icon: "mdi:battery-charging"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        lambda: |-
            if (id(battery_current).state > 0)
              return id(battery_voltage).state * id(battery_current).state;
            else
              return 0;
    -   platform: template
        name: "Battery Discharge Power"
        id: battery_discharge_power
        icon: "mdi:battery-arrow-down"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        lambda: |-
            if (id(battery_current).state < 0)
              return id(battery_voltage).state * -id(battery_current).state;
            else
              return 0;            
    -   platform: integration
        name: "Battery Charged Energy"
        sensor: battery_charge_power
        icon: "mdi:battery-plus-outline"
        time_unit: h
        unit_of_measurement: Wh
        device_class: energy
        state_class: total_increasing
        accuracy_decimals: 3
    -   platform: integration
        name: "Battery Discharged Energy"
        sensor: battery_discharge_power
        icon: "mdi:battery-minus-outline"
        time_unit: h
        unit_of_measurement: Wh
        device_class: energy
        state_class: total_increasing
        accuracy_decimals: 3

    -   platform: template
        name: "Charge Current"
        id: charge_current
        icon: "mdi:arrow-down-bold-circle"
        unit_of_measurement: A
        lambda: |-
            if (id(battery_current).state > 0)
              return id(battery_current).state;
            return 0;
    -   platform: template
        name: "Discharge Current"
        id: discharge_current
        icon: "mdi:arrow-up-bold-circle"
        unit_of_measurement: A
        lambda: |-
            if (id(battery_current).state < 0)
              return -id(battery_current).state;
            return 0;
    -   platform: integration
        name: "Battery Charged Ah"
        id: battery_charged_ah
        sensor: charge_current
        icon: "mdi:battery-charging-high"
        time_unit: h
        unit_of_measurement: Ah
        state_class: total_increasing
        accuracy_decimals: 3
    -   platform: integration
        name: "Battery Discharged Ah"
        id: battery_discharged_ah
        sensor: discharge_current
        icon: "mdi:battery-outline"
        time_unit: h
        unit_of_measurement: Ah
        state_class: total_increasing
        accuracy_decimals: 3

    # Уровень заряда: кулоновский счёт с привязкой к напряжению.
    # Собственный SoC от BMS не используем — он уползает вниз даже под зарядным.
    -   platform: template
        name: "Battery Level"
        id: battery_soc
        icon: "mdi:battery-check"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        accuracy_decimals: 0
        update_interval: ${update_interval}
        lambda: |-
            float v = id(battery_voltage).state;
            // Выше порога полного заряда всегда показываем 100%
            if (!isnan(v) && v >= ${battery_full_voltage}) return 100.0f;
            if (id(soc_ah) < 0.0f) return NAN;
            return id(soc_ah) / ${battery_capacity_ah} * 100.0f;

    # Сырое состояние счётчика — по нему видно, врёт ли оценка
    -   platform: template
        name: "Battery Remaining Ah"
        id: battery_remaining_ah
        icon: "mdi:battery-70"
        unit_of_measurement: Ah
        state_class: measurement
        accuracy_decimals: 2
        update_interval: ${update_interval}
        lambda: |-
            if (id(soc_ah) < 0.0f) return NAN;
            return id(soc_ah);

text_sensor:
    -   platform: daly_bms
        status:
            name: "BMS Status"
            id: bms_status
            icon: "mdi:information-outline"

binary_sensor:
    -   platform: daly_bms
        charging_mos_enabled:
            name: "Charging MOS"
            id: charging_mos
            icon: "mdi:electric-switch"
        discharging_mos_enabled:
            name: "Discharging MOS"
            id: discharging_mos
            icon: "mdi:electric-switch"

# Управление MOSFET-ами: нативной поддержки в компоненте daly_bms нет,
# команды шлём напрямую в UART (см. пример в документации ESPHome).
# Состояние берём из binary_sensor'ов выше, поэтому свитчи не optimistic.
# restore_mode: DISABLED обязателен — иначе на каждой загрузке сработал бы
# turn_off_action и BMS отрубал бы заряд/разряд.
# После команды даём BMS 500 мс применить её и внеочередно опрашиваем хаб,
# чтобы состояние не ждало следующего цикла update_interval.
switch:
    -   platform: template
        name: "Charging MOS Control"
        id: charging_mos_switch
        icon: "mdi:battery-charging"
        restore_mode: DISABLED
        lambda: |-
            if (!id(charging_mos).has_state()) return {};
            return id(charging_mos).state;
        turn_on_action:
            -   uart.write: [0xA5, 0x40, 0xDA, 0x08, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xC8]
            -   logger.log: "Daly: charging MOS on"
            -   delay: 500ms
            -   component.update: daly_bms_hub
        turn_off_action:
            -   uart.write: [0xA5, 0x40, 0xDA, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xC7]
            -   logger.log: "Daly: charging MOS off"
            -   delay: 500ms
            -   component.update: daly_bms_hub

    -   platform: template
        name: "Discharging MOS Control"
        id: discharging_mos_switch
        icon: "mdi:battery-arrow-down"
        restore_mode: DISABLED
        lambda: |-
            if (!id(discharging_mos).has_state()) return {};
            return id(discharging_mos).state;
        turn_on_action:
            -   uart.write: [0xA5, 0x40, 0xD9, 0x08, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xC7]
            -   logger.log: "Daly: discharging MOS on"
            -   delay: 500ms
            -   component.update: daly_bms_hub
        turn_off_action:
            -   uart.write: [0xA5, 0x40, 0xD9, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xC6]
            -   logger.log: "Daly: discharging MOS off"
            -   delay: 500ms
            -   component.update: daly_bms_hub

# Перезагрузка платы BMS — та же кнопка, что в приложении Smart BMS.
# Команда 0x00, тело пустое, контрольная сумма 0xA5+0x40+0x00+0x08 = 0xED.
button:
    -   platform: template
        name: "BMS Reset"
        id: bms_reset_button
        icon: "mdi:restart-alert"
        entity_category: config
        on_press:
            -   uart.write: [0xA5, 0x40, 0x00, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xED]
            -   logger.log: "Daly: BMS reset"

