esphome:
    name: battery1
    friendly_name: "Аккумулятор 1"
    platformio_options:
        board_build.f_flash: 40000000L
        board_build.flash_mode: dio
        board_build.flash_size: 4MB

esp32:
    board: esp32-c3-devkitm-1
    variant: ESP32C3
    framework:
        type: esp-idf

# Enable logging
logger:
    level: INFO

# Enable Home Assistant API
api:
    encryption:
        key: !secret battery1_api_encryption_key

ota:
    -   platform: esphome
        password: !secret battery1_ota_password

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    fast_connect: true

switch:
    -   platform: restart
        name: "Battery 1 Restart"

sensor:
    -   platform: wifi_signal
        name: "WiFi Signal dB"
        id: wifi_signal_db
        update_interval: 60s
        entity_category: "diagnostic"

uart:
    tx_pin: GPIO3
    rx_pin: GPIO2
    rx_buffer_size: 512
    baud_rate: 9600

packages:
    daly: !include
        file: common/daly-bms.yaml
        vars:
            update_interval: 10s
            battery_capacity_ah: "100.0"    # паспортная ёмкость банки, А·ч
            battery_full_voltage: "14.0"    # выше этого всегда показываем 100%
            battery_tail_current: "2.0"     # хвостовой ток 0.02C — признак реально полного заряда

